[package]
name = "wled-cli"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "wled"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
ureq = { version = "2.10", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
